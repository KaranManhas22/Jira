<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>College Library Management System</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .search-container { max-width: 600px; margin: 0 auto; }
        .search-box { width: 100%; padding: 10px; font-size: 16px; }
        .results { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" class="search-box" id="searchInput" placeholder="Search library items...">
        <ul class="results" id="searchResults"></ul>
    </div>

    <script>
        document.getElementById('searchInput').addEventListener('input', debounce(function() {
            const query = this.value.trim();
            if (query === '') {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }
            fetch(`/api/library/search?query=${encodeURIComponent(query)}`, {
                method: 'GET',
                cache: 'no-cache'
            }).then(response => response.json())
            .then(data => {
                const resultsContainer = document.getElementById('searchResults');
                resultsContainer.innerHTML = '';
                if (data.items.length === 0) {
                    resultsContainer.innerHTML = '<li>No results found</li>';
                } else {
                    data.items.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = `${item.title} - ${item.author}`;
                        resultsContainer.appendChild(li);
                    });
                }
            }).catch(error => {
                console.error('Search failed', error);
                document.getElementById('searchResults').innerHTML = '<li>Search failed: ${error.message}</li>';
            });
        }, 300));

        function debounce(func, delay) {
            let timeoutId;
            return function () {
                const context = this,
                      args = arguments;
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => func.apply(context, args), delay);
            };
        }
    </script>
</body>
</html>
