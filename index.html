<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overdue Loans</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <style>
        :root {
            --color-primary: #616161;
            --color-secondary: #51a7bb;
            --color-warn: #cc4e5e;
        }
        .section {
            max-width: 600px;
            margin: 0 auto;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .table th, .table td {
            padding: 12px;
            border: 1px solid var(--color-primary);
            text-align: left;
        }
        .table th {
            background-color: #f9f9f9;
            color: var(--color-primary);
        }
        .table tr:nth-child(even) td {
            background-color: #f5f5f5;
        }
        .btn.tailwind-card {
            display: inline-block;
            padding: 12px 24px;
            background-color: var(--color-warn);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
        }
        .status-card {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;</style>
</head>
<body>
    <div class="container">
        <h1>Overdue Loans</h1>
        <div class="section">
            <h2>Loan List</h2>
            <table class="table">
                <thead>
                    <tr><th>Loan ID</th><th>Student Name</th><th>email</th><th>Amount</th><th>Status</th></tr></thead>
                <tbody>
                    <tr><td>1001</td><td>John Doe</td><td>john@example.com</td><td>$1200</td><td><button class="btn.tailwind-card">View Loan</button></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
