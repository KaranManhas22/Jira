<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Library Management System - Member Access</title>
    <link rel="stylesheet" href="https://cdn.tailwindcss.com">
</head>
<body class="bg-gray-100 text-white">
    <header class="bg-indigo-600 py-4 px-6 mx-auto max-w-7xl mx-auto mb-6">
        <div class="flex justify-between items-center">
            <h1 class="text-4xl font-bold text-white">College Library Management System</h1>
            <a href="#" class="text-lg text-white font-semibold">Member Access</a>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-6 sm:px-12">
        <section class="my-12">
            <h2 class="text-3xl font-bold mb-6 text-white">Member Access Section</h2>
            <div class="bg-white p-6 mb-8 rounded-lg shadow-md">
                <form class="space-y-6">
                    <div class="flex flex-col sm:flex-row">
                        <div class="md:w-1/3 mb-6 md:mb-0">
                            <label class="block text-gray-700">
                                <span class="font-medium mb-2">Username:</span>
                            </label>
                            <input class="bg-white p-3 rounded-lg shadow-sm block w-full focus:outline-none">
                        </div>
                        <div class="md:w-1/3 mb-6 md:mb-0">
                            <label class="block text-gray-700">
                                <span class="font-medium mb-2">Password:</span>
                            </label>
                            <input class="bg-white p-3 rounded-lg shadow-sm block w-full focus:outline-none">
                        </div>
                        <div class="md:w-1/3 mb-6 md:mb-0">
                            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg w-full transition duration-300">
                                Proceed</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
